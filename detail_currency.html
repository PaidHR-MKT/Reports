  <script>
  // Capture UTM params (first touch) and keep them for later forms
  (function(){
    function getParams() {
      const p = new URLSearchParams(window.location.search);
      const obj = {};
      ['utm_source','utm_medium','utm_campaign','utm_term','utm_content'].forEach(k=>{
        if (p.get(k)) obj[k] = p.get(k);
      });
      return obj;
    }
    const stored = JSON.parse(localStorage.getItem('utm_params') || '{}');
    const fresh = getParams();
    if (Object.keys(fresh).length) {
      localStorage.setItem('utm_params', JSON.stringify({...stored, ...fresh}));
    }
  })();
</script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    // Attach to all Webflow forms
    document.querySelectorAll('form').forEach(function(form){
      form.addEventListener('submit', function(){
        try {
          const fd = new FormData(form);
          const data = Object.fromEntries(fd.entries());
          // Pull UTM (if stored)
          let utm = {};
          try { utm = JSON.parse(localStorage.getItem('utm_params') || '{}'); } catch(e){}
          // Choose a person identifier strategy:
          // 1) Use email as id (simple), OR
          // 2) If you have your own user_id, use that as "id" and still pass "email"
          const personId = (data.email || data.Email || '').trim();
          // Identify / upsert person
          _cio.identify(Object.assign({
            id: personId,                     // required for identify
            email: personId,                  // keep email attribute too
            first_name: data.first_name || data.name || '',
            last_name: data.last_name || '',
            company: data.company || '',
            form_source: (form.getAttribute('name') || form.id || 'webflow_form'),
            page_url: window.location.href,
            referrer: document.referrer || ''
          }, utm));
          // Track the submission event with full payload (be mindful of PII you include)
          _cio.track('webflow_form_submitted', Object.assign({
            form_name: form.getAttribute('name') || form.id || 'webflow_form',
            timestamp: Date.now()
          }, data, utm));
        } catch (err) {
          console.warn('Customer.io tracking error', err);
        }
      }, { passive: true });
    });
  });
</script>
