  <script>
  // Capture UTM params (first touch) and keep them for later forms
  (function(){
    function getParams() {
      const p = new URLSearchParams(window.location.search);
      const obj = {};
      ['utm_source','utm_medium','utm_campaign','utm_term','utm_content'].forEach(k=>{
        if (p.get(k)) obj[k] = p.get(k);
      });
      return obj;
    }
    const stored = JSON.parse(localStorage.getItem('utm_params') || '{}');
    const fresh = getParams();
    if (Object.keys(fresh).length) {
      localStorage.setItem('utm_params', JSON.stringify({...stored, ...fresh}));
    }
  })();
</script>
